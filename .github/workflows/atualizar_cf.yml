- name: Converter HTML para Markdown com Links e Tachados
      run: |
        python -c "
        import os
        import re
        import html
        from urllib.parse import urljoin

        url_base = 'https://www.planalto.gov.br'

        with open('CF_88.html', 'r', encoding='utf-8') as f:
            conteudo = f.read()

        # 1. Remove cabeçalhos complexos, scripts e estilos do código
        conteudo = re.sub(r'(?i)<head[^>]*>([\s\S]*?)</head>', '', conteudo)
        conteudo = re.sub(r'(?i)<script[^>]*>([\s\S]*?)</script>', '', conteudo)
        conteudo = re.sub(r'(?i)<style[^>]*>([\s\S]*?)</style>', '', conteudo)

        # 2. Converte tags de link HTML para Markdown de forma textual direta
        def processar_link(match):
            propriedades = match.group(1)
            texto_interno = match.group(2).strip()
            href_match = re.search(r'href=[\"\']?([^\"\' >]+)[\"\']?', propriedades, re.IGNORECASE)
            if href_match and texto_interno:
                link_completo = urljoin(url_base, href_match.group(1))
                return f'[{texto_interno}]({link_completo})'
            return texto_interno

        conteudo = re.sub(r'(?i)<a([^>]+)>([\s\S]*?)</a>', processar_link, conteudo)

        # FIX DO ART. 6º: Remove quebras de linha artificiais e padroniza o 'º' que veio quebrado
        conteudo = re.sub(r'(?i)Art\.\s*6\s*<\s*[^>]*>\s*o', 'Art. 6º', conteudo)
        conteudo = re.sub(r'(?i)Art\.\s*6\n+o', 'Art. 6º', conteudo)

        # =========================================================================
        # TRATAMENTO CORRIGIDO DE TACHADOS (PROCESSAMENTO LIMPO)
        # =========================================================================
        # Remove quebras de linha internas de dentro das tags de tachado para não quebrar o Markdown
        def limpar_tachado(match):
            texto = match.group(1).strip()
            texto = re.sub(r'\s*\n\s*', ' ', texto) # Transforma quebras internas em espaço simples
            return f'~~{texto}~~' if texto else ''

        conteudo = re.sub(r'(?i)<strike[^>]*>([\s\S]*?)</strike>', limpar_tachado, conteudo)
        conteudo = re.sub(r'(?i)<s>([\s\S]*?)</s>', limpar_tachado, conteudo)
        conteudo = re.sub(r'(?i)<del[^>]*>([\s\S]*?)</del>', limpar_tachado, conteudo)
        conteudo = re.sub(r'(?i)<font[^>]*style\s*=\s*[\"\'][^\"\']*line-through[^\"\']*[\"\'][^>]*>([\s\S]*?)</font>', limpar_tachado, conteudo)
        conteudo = re.sub(r'(?i)<p[^>]*class=[\"\']?(?:text-through|txtTachado|revogado)[\"\']?[^>]*>([\s\S]*?)</p>', limpar_tachado, conteudo)
        # =========================================================================

        # 3. Tratamento pré-limpeza: Remove quebras de linha residuais do Windows
        conteudo = conteudo.replace('\r\n', '\n').replace('\r', '\n')

        # 4. Remove absolutamente todas as demais tags HTML restantes
        texto_limpo = re.sub(r'<[^>]+>', '', conteudo)
        texto_limpo = html.unescape(texto_limpo)

        # 5. Corrige hífens no início de linhas para evitar listas automáticas do Markdown
        linhas_corrigidas = []
        for linha in texto_limpo.split('\n'):
            linha_sub = linha.strip()
            if linha_sub.startswith('-') or linha_sub.startswith('–') or linha_sub.startswith('—'):
                linha = re.sub(r'^[-–—]\s*', '— ', linha_sub)
            linhas_corrigidas.append(linha)

        texto_limpo = '\n'.join(linhas_corrigidas)

        # 6. Limpeza final de espaços redundantes
        texto_limpo = re.sub(r'[ \t]+', ' ', texto_limpo)
        texto_limpo = re.sub(r'\n\s*\n\s*\n+', '\n\n', texto_limpo)

        # 7. Une parágrafos curtos isolados (evita órfãos como o 'o' solto)
        blocos = texto_limpo.split('\n\n')
        resultado = []
        i = 0
        while i < len(blocos):
            bloco_atual = blocos[i].strip()
            if len(bloco_atual) < 25 and bloco_atual and i + 1 < len(blocos):
                proximo = blocos[i + 1].strip()
                # Se o bloco atual for apenas lixo ou pedaço de artigo, junta colado
                resultado.append(bloco_atual + ' ' + proximo)
                i += 2
            else:
                resultado.append(bloco_atual)
                i += 1

        texto_limpo = '\n\n'.join(resultado)

        # Garante as pastas e títulos referenciando a CF88 corretamente
        os.makedirs('Constituicao', exist_ok=True)

        with open('Constituicao/CF88.md', 'w', encoding='utf-8') as f:
            f.write('# Constituição da República Federativa do Brasil de 1988\n\n' + texto_limpo.strip())
        "
