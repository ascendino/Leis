name: Atualizador Automático de CF/88
on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite força a atualização manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o git push funcionar
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Baixa e converte a codificação do Planalto nativamente no Linux
    - name: Baixar Lei Seca Atualizada (Planalto)
      run: |
        curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" \
          -o cf_raw.html
        iconv -f iso-8859-1 -t utf-8//IGNORE cf_raw.html -o CF_88.html

    - name: Converter HTML para Markdown com Links e Tachados
      run: |
        python -c "
        import os
        import re
        import html
        from urllib.parse import urljoin

        url_base = 'https://www.planalto.gov.br'

        with open('CF_88.html', 'r', encoding='utf-8') as f:
            conteudo = f.read()

        # 1. Remove cabeçalhos, scripts e estilos complexos
        conteudo = re.sub(r'(?i)<head[^>]*>([\s\S]*?)</head>', '', conteudo)
        conteudo = re.sub(r'(?i)<script[^>]*>([\s\S]*?)</script>', '', conteudo)
        conteudo = re.sub(r'(?i)<style[^>]*>([\s\S]*?)</style>', '', conteudo)

        # 2. Converte links HTML para Markdown de forma direta
        def processar_link(match):
            propriedades = match.group(1)
            texto_interno = match.group(2).strip()
            href_match = re.search(r'href=[\"\']?([^\"\' >]+)[\"\']?', propriedades, re.IGNORECASE)
            if href_match and texto_interno:
                link_completo = urljoin(url_base, href_match.group(1))
                return f'[{texto_interno}]({link_completo})'
            return texto_interno

        conteudo = re.sub(r'(?i)<a([^>]+)>([\s\S]*?)</a>', processar_link, conteudo)

        # Normalização de quebras de linha para padrão Unix
        conteudo = conteudo.replace('\r\n', '\n').replace('\r', '\n')

        # Garante o alinhamento de quebras de parágrafos críticos do Planalto antes de limpar as tags
        conteudo = re.sub(r'(?i)</p>|<br\s*/?>|</tr>', '\n', conteudo)
        conteudo = re.sub(r'(?i)<p[^>]*>|<tr>', '\n', conteudo)

        # 3. CAPTURA DOS TACHADOS (Garante linearidade interna para o Markdown não quebrar)
        def limpar_quebras_internas(match):
            texto_interno = match.group(1)
            texto_linear = re.sub(r'\s*\n\s*', ' ', texto_interno).strip()
            return f'~~{texto_linear}~~' if texto_linear else ''

        conteudo = re.sub(r'(?i)<strike[^>]*>([\s\S]*?)</strike>', limpar_quebras_internas, conteudo)
        conteudo = re.sub(r'(?i)<s>([\s\S]*?)</s>', limpar_quebras_internas, conteudo)
        conteudo = re.sub(r'(?i)<del[^>]*>([\s\S]*?)</del>', limpar_quebras_internas, conteudo)
        conteudo = re.sub(r'(?i)<font[^>]*style=[^>]*line-through[^>]*>([\s\S]*?)</font>', limpar_quebras_internas, conteudo)
        conteudo = re.sub(r'(?i)<p[^>]*class=[\"\']?(?:text-through|txtTachado|revogado)[\"\']?[^>]*>([\s\S]*?)</p>', lambda m: '\n\n~~' + re.sub(r'\s*\n\s*', ' ', m.group(1)).strip() + '~~\n\n', conteudo)

        # 4. Remove todas as demais tags HTML restantes com segurança
        texto_limpo = re.sub(r'<[^>]+>', '', conteudo)
        texto_limpo = html.unescape(texto_limpo)

        # 5. Formatação estrutural linha por linha (Identifica cabeçalhos e corrige recuos)
        linhas_corrigidas = []
        for linha in texto_limpo.split('\n'):
            linha_sub = linha.strip()
            if not len(linha_sub):
                continue
            
            # Formatação de Títulos, Capítulos e Seções completos (Aplica ##, ###, ####)
            if re.match(r'^T[IÍ]TULO\s+[IVXLCDM\d]+', linha_sub, re.IGNORECASE):
                linhas_corrigidas.append('\n## ' + linha_sub)
            elif re.match(r'^CAP[IÍ]TULO\s+[IVXLCDM\d]+', linha_sub, re.IGNORECASE):
                linhas_corrigidas.append('\n### ' + linha_sub)
            elif re.match(r'^SE[CÇ][AÃ]O\s+[IVXLCDM\d]+', linha_sub, re.IGNORECASE):
                linhas_corrigidas.append('\n#### ' + linha_sub)
            elif re.match(r'^SUBSE[CÇ][AÃ]O\s+[IVXLCDM\d]+', linha_sub, re.IGNORECASE):
                linhas_corrigidas.append('\n##### ' + linha_sub)
            
            # Tratamento de Artigos, Incisos e Parágrafos para mantê-los isolados e organizados
            else:
                # Se for um inciso ou travessão, garante a quebra de linha visual limpa
                if re.match(r'^[IVXLCDM]+\s*-\s*', linha_sub) or linha_sub.startswith(('-', '–', '—')):
                    linha_sub = re.sub(r'^[-–—]\s*', '', linha_sub)
                    linhas_corrigidas.append('\n' + linha_sub)
                # Alíneas isoladas (ex: a), b)) ganham quebra de linha própria para não grudar no inciso
                elif re.match(r'^[a-z]\)', linha_sub):
                    linhas_corrigidas.append('\n' + linha_sub)
                # Artigos e Parágrafos ganham quebra própria
                elif linha_sub.startswith(('Art.', 'Parágrafo', '§')):
                    linhas_corrigidas.append('\n\n' + linha_sub)
                else:
                    linhas_corrigidas.append('\n' + linha_sub)

        texto_limpo = ''.join(linhas_corrigidas)

        # 6. Otimização final de espaços e alinhamento do delimitador de tachado
        texto_limpo = re.sub(r'[ \t]+', ' ', texto_limpo)
        texto_limpo = texto_limpo.replace('~~ ', '~~').replace(' ~~', '~~')
        texto_limpo = re.sub(r'\n\s*\n\s*\n+', '\n\n', texto_limpo)

        # 7. Une estritamente as notas de rodapé / emendas ao final do parágrafo correspondente
        blocos = texto_limpo.split('\n\n')
        resultado = []
        for bloco in blocos:
            bloco_limpo = bloco.strip()
            if not bloco_limpo:
                continue
            if (bloco_limpo.startswith('(Redação') or bloco_limpo.startswith('(Incluído') or bloco_limpo.startswith('(Vide')) and resultado:
                resultado[-1] = resultado[-1] + ' ' + bloco_limpo
            else:
                resultado.append(bloco_limpo)

        texto_limpo = '\n\n'.join(resultado)

        # Criação do diretório e gravação do arquivo final compilado
        os.makedirs('Constituicao', exist_ok=True)

        with open('Constituicao/CF88.md', 'w', encoding='utf-8') as f:
            f.write('# Constituição da República Federativa do Brasil de 1988\n\n' + texto_limpo.strip())
        "

    - name: Verificar mudanças e commitar
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Adiciona o arquivo gerado para o Git poder rastrear as modificações
        git add Constituicao/CF88.md

        if ! git diff --cached --quiet; then
          git commit -m "Auto: CF_88 atualizada em $(date +'%d/%m/%Y')"
          git push
        else
          echo "Nenhuma alteração encontrada na lei."
        fi
