name: Atualizador Automático de CF/88
on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite força a atualização manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o git push funcionar
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Baixa e converte a codificação do Planalto nativamente no Linux
    - name: Baixar Lei Seca Atualizada (Planalto)
      run: |
        curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" \
          -o cf_raw.html
        iconv -f iso-8859-1 -t utf-8//IGNORE cf_raw.html -o CF_88.html

    - name: Converter HTML para Markdown com Links e Tachados
      run: |
        python -c "
        import os
        import re
        import html
        from urllib.parse import urljoin

        url_base = 'https://www.planalto.gov.br'

        with open('CF_88.html', 'r', encoding='utf-8') as f:
            conteudo = f.read()

        # 1. Remove cabeçalhos, scripts e estilos complexos
        conteudo = re.sub(r'(?i)<head[^>]*>([\s\S]*?)</head>', '', conteudo)
        conteudo = re.sub(r'(?i)<script[^>]*>([\s\S]*?)</script>', '', conteudo)
        conteudo = re.sub(r'(?i)<style[^>]*>([\s\S]*?)</style>', '', conteudo)

        # 2. Converte links HTML para Markdown mantendo o destino oficial
        def processar_link(match):
            propriedades = match.group(1)
            texto_interno = match.group(2).strip()
            href_match = re.search(r'href=[\"\']?([^\"\' >]+)[\"\']?', propriedades, re.IGNORECASE)
            if href_match and texto_interno:
                link_completo = urljoin(url_base, href_match.group(1))
                return f'[{texto_interno}]({link_completo})'
            return texto_interno

        conteudo = re.sub(r'(?i)<a([^>]+)>([\s\S]*?)</a>', processar_link, conteudo)

        # CORREÇÃO CRUCIAL 1: Normaliza quebras de linha de bloco do HTML antes do filtro de tachados
        conteudo = conteudo.replace('\r\n', '\n').replace('\r', '\n')
        # Transforma quebras de linha consecutivas dentro de tags em espaços simples para não quebrar a regex
        conteudo = re.sub(r'(<font[^>]*>|<strike[^>]*>|<p[^>]*>)([\s\S]*?)(</font>|</strike>|</p>)', lambda m: m.group(1) + m.group(2).replace('\n', ' ') + m.group(3), conteudo)

        # Padroniza a escrita do caractere indicador de ordem ordinal (º) do Art. 6º
        conteudo = re.sub(r'(?i)Art\.\s*6\s*<\s*[^>]*>\s*o', 'Art. 6º', conteudo)
        conteudo = re.sub(r'(?i)Art\.\s*6\s+o', 'Art. 6º', conteudo)

        # 3. CAPTURA DOS TACHADOS: Mapeia todas as formas de texto revogado do Planalto
        conteudo = re.sub(r'(?i)<strike[^>]*>([\s\S]*?)</strike>', r'~~\1~~', conteudo)
        conteudo = re.sub(r'(?i)<s>([\s\S]*?)</s>', r'~~\1~~', conteudo)
        conteudo = re.sub(r'(?i)<del[^>]*>([\s\S]*?)</del>', r'~~\1~~', conteudo)
        conteudo = re.sub(r'(?i)<font[^>]*style=[^>]*line-through[^>]*>([\s\S]*?)</font>', r'~~\1~~', conteudo)
        conteudo = re.sub(r'(?i)<p[^>]*class=[\"\']?(?:text-through|txtTachado|revogado)[\"\']?[^>]*>([\s\S]*?)</p>', r'\n\n~~\1~~\n\n', conteudo)

        # 4. Limpa todas as demais tags estruturais do HTML com segurança
        texto_limpo = re.sub(r'<[^>]+>', '', conteudo)
        texto_limpo = html.unescape(texto_limpo)

        # 5. Formatação de travessões legislativos (—) no início dos parágrafos/incisos
        linhas_corrigidas = []
        for linha in texto_limpo.split('\n'):
            linha_sub = linha.strip()
            if linha_sub.startswith('-') or linha_sub.startswith('–') or linha_sub.startswith('—'):
                linha = re.sub(r'^[-–—]\s*', '— ', linha_sub)
            linhas_corrigidas.append(linha)

        texto_limpo = '\n'.join(linhas_corrigidas)

        # 6. Otimização de espaçamentos do Markdown e colagem das tags do Obsidian
        texto_limpo = re.sub(r'[ \t]+', ' ', texto_limpo)
        texto_limpo = texto_limpo.replace('~~ ', '~~').replace(' ~~', '~~')
        
        # Remove quebras de linha acidentais que ficaram presas dentro dos marcadores ~~
        texto_limpo = re.sub(r'~~([^~]+)~~', lambda m: '~~' + m.group(1).replace('\n', ' ').strip() + '~~', texto_limpo)

        # Remove linhas em branco excessivas
        texto_limpo = re.sub(r'\n\s*\n\s*\n+', '\n\n', texto_limpo)

        # CORREÇÃO CRUCIAL 2: Agrupa APENAS as referências de emendas de fim de parágrafo (Evita quebra do Art. 7)
        blocos = texto_limpo.split('\n\n')
        resultado = []
        for bloco in blocos:
            bloco_limpo = bloco.strip()
            if not bloco_limpo:
                continue
            # Se o bloco atual for apenas um indicador de Emenda solto (ex: '(Redação dada pela...)'), une ao anterior
            if (bloco_limpo.startswith('(Redação') or bloco_limpo.startswith('(Incluído') or bloco_limpo.startswith('(Vide')) and resultado:
                resultado[-1] = resultado[-1] + ' ' + bloco_limpo
            else:
                resultado.append(bloco_limpo)

        texto_limpo = '\n\n'.join(resultado)

        # Criação da pasta de destino e gravação final limpa
        os.makedirs('Constituicao', exist_ok=True)

        with open('Constituicao/CF88.md', 'w', encoding='utf-8') as f:
            f.write('# Constituição da República Federativa do Brasil de 1988\n\n' + texto_limpo.strip())
        "

    - name: Verificar mudanças e commitar
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Adiciona o arquivo gerado para o Git poder rastrear as modificações
        git add Constituicao/CF88.md

        if ! git diff --cached --quiet; then
          git commit -m "Auto: CF_88 atualizada em $(date +'%d/%m/%Y')"
          git push
        else
          echo "Nenhuma alteração encontrada na lei."
        fi
