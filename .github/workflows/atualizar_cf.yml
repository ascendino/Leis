name: Atualizador Automático de CF/88
on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite força a atualização manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o git push funcionar
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Baixa e converte a codificação do Planalto nativamente no Linux
    - name: Baixar Lei Seca Atualizada (Planalto)
      run: |
        curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" \
          -o cf_raw.html
        iconv -f iso-8859-1 -t utf-8//IGNORE cf_raw.html -o CF_88.html

    - name: Converter HTML para Markdown com Links e Tachados
      run: |
        python -c "
        import os
        import re
        import html
        from urllib.parse import urljoin

        url_base = 'https://www.planalto.gov.br'

        with open('CF_88.html', 'r', encoding='utf-8') as f:
            conteudo = f.read()

        # 1. Remove cabeçalhos, scripts e estilos complexos
        conteudo = re.sub(r'(?i)<head[^>]*>([\s\S]*?)</head>', '', conteudo)
        conteudo = re.sub(r'(?i)<script[^>]*>([\s\S]*?)</script>', '', conteudo)
        conteudo = re.sub(r'(?i)<style[^>]*>([\s\S]*?)</style>', '', conteudo)

        # 2. Converte links HTML para Markdown
        def processar_link(match):
            propriedades = match.group(1)
            texto_interno = match.group(2).strip()
            href_match = re.search(r'href=[\"\']?([^\"\' >]+)[\"\']?', propriedades, re.IGNORECASE)
            if href_match and texto_interno:
                link_completo = urljoin(url_base, href_match.group(1))
                return f'[{texto_interno}]({link_completo})'
            return texto_interno

        conteudo = re.sub(r'(?i)<a([^>]+)>([\s\S]*?)</a>', processar_link, conteudo)

        # Normalização inicial padrão de quebras de linha
        conteudo = conteudo.replace('\r\n', '\n').replace('\r', '\n')

        # CORREÇÃO UNIFORME DE ARTIGOS: Garante que 'Art.' e seu número fiquem grudados na mesma linha
        conteudo = re.sub(r'(?i)Art\.\s*6\s*<\s*[^>]*>\s*o', 'Art. 6º', conteudo)
        conteudo = re.sub(r'(?i)Art\.\s*6\s+o', 'Art. 6º', conteudo)
        conteudo = re.sub(r'(?i)Art\.\s*\n+\s*(\d+)', r'Art. \1', conteudo)

        # 3. CAPTURA DOS TACHADOS (Remove quebra de linha APENAS dentro do texto riscado)
        def limpar_quebras_internas(match):
            texto_interno = match.group(1)
            texto_linear = re.sub(r'\s*\n\s*', ' ', texto_interno).strip()
            return f'~~{texto_linear}~~' if texto_linear else ''

        conteudo = re.sub(r'(?i)<strike[^>]*>([\s\S]*?)</strike>', limpar_quebras_internas, conteudo)
        conteudo = re.sub(r'(?i)<s>([\s\S]*?)</s>', limpar_quebras_internas, conteudo)
        conteudo = re.sub(r'(?i)<del[^>]*>([\s\S]*?)</del>', limpar_quebras_internas, conteudo)
        conteudo = re.sub(r'(?i)<font[^>]*style=[^>]*line-through[^>]*>([\s\S]*?)</font>', limpar_quebras_internas, conteudo)
        conteudo = re.sub(r'(?i)<p[^>]*class=[\"\']?(?:text-through|txtTachado|revogado)[\"\']?[^>]*>([\s\S]*?)</p>', lambda m: '\n\n~~' + re.sub(r'\s*\n\s*', ' ', m.group(1)).strip() + '~~\n\n', conteudo)

        # 4. Limpa todas as demais tags estruturais do HTML com segurança
        texto_limpo = re.sub(r'<[^>]+>', '', conteudo)
        texto_limpo = html.unescape(texto_limpo)

        # 5. Formatação estrutural de linhas (Evita listas automáticas ruins do Markdown)
        linhas_corrigidas = []
        for linha in texto_limpo.split('\n'):
            linha_sub = linha.strip()
            if not linha_sub:
                continue
            
            # Formatação de
