name: Atualizador Automático de Lei

on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite que você force a atualização manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Baixar Lei Seca Atualizada
      run: |
        curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://planalto.gov.br" -o ctb_atualizado.html

    - name: Converter HTML para Markdown limpo
      run: |
        python -c "
        import re
        import html

        # Lê o arquivo usando o formato do Planalto (latin-1)
        with open('ctb_atualizado.html', 'r', encoding='latin-1') as f:
            conteudo = f.read()

        # Remove todas as tags HTML usando expressão regular direta
        texto_limpo = re.sub(r'<[^>]+>', '', conteudo)
        
        # Converte códigos HTML como &nbsp; ou &amp; em texto normal
        texto_limpo = html.unescape(texto_limpo)
        
        # Remove linhas em branco excessivas
        texto_limpo = re.sub(r'\n\s*\n', '\n\n', texto_limpo)

        # Salva o arquivo final em UTF-8 padrão do GitHub
        with open('ctb_atualizado.md', 'w', encoding='utf-8') as f:
            f.write('# Código de Trânsito Brasileiro (Lei 9.503)\n\n' + texto_limpo)
        "

    - name: Verificar mudanças e commitar
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        git add ctb_atualizado.html ctb_atualizado.md
        
        if ! git diff --cached --quiet; then
          git commit -m "Auto: Código de Trânsito Brasileiro e Markdown atualizados em $(date +'%d/%m/%Y')"
          git push
        else
          echo "Nenhuma alteração encontrada no site do Planalto."
        fi
