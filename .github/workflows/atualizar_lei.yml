name: Atualizador Automático de Lei
on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite que você force a atualização manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o git push funcionar
    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Baixa e converte a codificação do Planalto nativamente no Linux
    - name: Baixar Lei Seca Atualizada (Planalto)
      run: |
        curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          "https://planalto.gov.br" \
          -o ctb_raw.html
        iconv -f iso-8859-1 -t utf-8//IGNORE ctb_raw.html -o ctb_atualizado.html

    - name: Converter HTML para Markdown com Links
      run: |
        python -c "
        import os
        import re
        import html
        from urllib.parse import urljoin
        
        url_base = 'https://planalto.gov.br'
        
        with open('ctb_atualizado.html', 'r', encoding='utf-8') as f:
            conteudo = f.read()
            
        # 1. Remove cabeçalhos complexos, scripts e estilos do código
        conteudo = re.sub(r'(?i)<head[^>]*>([\s\S]*?)</head>', '', conteudo)
        conteudo = re.sub(r'(?i)<script[^>]*>([\s\S]*?)</script>', '', conteudo)
        conteudo = re.sub(r'(?i)<style[^>]*>([\s\S]*?)</style>', '', conteudo)
        
        # 2. Converte tags de link HTML para Markdown de forma textual direta
        def processar_link(match):
            propriedades = match.group(1)
            texto_interno = match.group(2).strip()
            href_match = re.search(r'href=[\"\']?([^\"\' >]+)[\"\']?', propriedades, re.IGNORECASE)
            if href_match and texto_interno:
                link_completo = urljoin(url_base, href_match.group(1))
                return f'[{texto_interno}]({link_completo})'
            return texto_interno
            
        conteudo = re.sub(r'(?i)<a([^>]+)>([\s\S]*?)</a>', processar_link, conteudo)
        
        # 3. CORREÇÃO DO ERRO DE FORMATAÇÃO (Une vetos fragmentados na mesma linha)
        conteudo = re.sub(r'(?i)(§\s*\d+º|I|II|III|IV|V|VI|VII|VIII|IX|X)\s*<[^>]+>\s*<[^>]+>\s*\(VETADO\)', r'\1 (VETADO)', conteudo)
        conteudo = re.sub(r'(?i)(§\s*\d+º|I|II|III|IV|V|VI|VII|VIII|IX|X)\s*([\n\r\s]*)\(VETADO\)', r'\1 (VETADO)', conteudo)
        
        # 4. Tratamento pré-limpeza: Remove quebras de linha indesejadas
        conteudo = conteudo.replace('\r\n', '\n').replace('\r', '\n')
        
        # 5. Remove absolutamente todas as demais tags HTML restantes
        texto_limpo = re.sub(r'<[^>]+>', '', conteudo)
        texto_limpo = html.unescape(texto_limpo)
        
        # 6. Corrige hífens no início de linhas para evitar listas automáticas do Markdown
        linhas_corrigidas = []
        for linha in texto_limpo.split('\n'):
            linha_sub = linha.strip()
            if linha_sub.startswith('-') or linha_sub.startswith('–') or linha_sub.startswith('—'):
                linha = re.sub(r'^[-–—]\s*', '— ', linha_sub)
            linhas_corrigidas.append(linha)
            
        texto_limpo = '\n'.join(linhas_corrigidas)
        
        # 7. Limpeza final de espaços redundantes
        texto_limpo = re.sub(r'[ \t]+', ' ', texto_limpo)
        texto_limpo = re.sub(r'\n\s*\n\s*\n+', '\n\n', texto_limpo)
        
        # Garante a criação da pasta correta
        os.makedirs('CTB', exist_ok=True)
        
        # Salva o arquivo final direto na pasta correta
        with open('CTB/ctb_atualizado.md', 'w', encoding='utf-8') as f:
            f.write('# Código de Trânsito Brasileiro (Lei 9.503)\n\n' + texto_limpo.strip())
        "

    - name: Limpar Repositório e Commitar
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"

        # Força a remoção completa de absolutamente TODOS os arquivos velhos e duplicados da raiz
        git rm -rf ctb_atualizado.md ctb_atualizado.html ctb_raw.html Leis/ || true

        # Garante a adição apenas da pasta correta
        git add CTB/ctb_atualizado.md

        if ! git diff --cached --quiet; then
          git commit -m "Auto: Limpeza profunda da raiz e correção do leiaute do CTB em $(date +'%d/%m/%Y')"
          git push
        else
          echo "Nenhuma alteração pendente no repositório."
        fi
