name: Atualizador Automático de Lei

on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite que você force a atualização manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências de extração
      run: pip install beautifulsoup4 lxml

    # Baixa e converte a codificação do Planalto nativamente no Linux antes do Python rodar
    - name: Baixar Lei Seca Atualizada (Planalto)
      run: |
        curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://planalto.gov.br" -o ctb_raw.html
        iconv -f iso-8859-1 -t utf-8//IGNORE ctb_raw.html -o ctb_atualizado.html

    - name: Converter HTML para Markdown com Links
      run: |
        python -c "
        import re
        import html
        from bs4 import BeautifulSoup
        from urllib.parse import urljoin

        url_base = 'https://planalto.gov.br'

        with open('ctb_atualizado.html', 'r', encoding='utf-8') as f:
            conteudo = f.read()

        soup = BeautifulSoup(conteudo, 'lxml')

        # Remove elementos nocivos à leitura
        for s in soup(['script', 'style']):
            s.decompose()

        # Transforma tags de link HTML em Markdown clicável [Texto](Link)
        for a in soup.find_all('a', href=True):
            texto_link = a.get_text().strip()
            if texto_link:
                link_completo = urljoin(url_base, a['href'])
                a.replace_with(f'[{texto_link}]({link_completo})')

        # Extrai o texto geral da norma limpo
        texto_final = soup.get_text('\n')
        texto_final = re.sub(r'[ \t]+', ' ', texto_final)
        texto_final = re.sub(r'\n\s*\n', '\n\n', texto_final)

        with open('ctb_atualizado.md', 'w', encoding='utf-8') as f:
            f.write('# Código de Trânsito Brasileiro (Lei 9.503)\n\n' + texto_final.strip())
        "

    - name: Verificar mudanças e commitar
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add ctb_atualizado.md
        
        if ! git diff --cached --quiet; then
          git commit -m "Auto: Código de Trânsito Brasileiro com links atualizado em $(date +'%d/%m/%Y')"
          git push
        else
          echo "Nenhuma alteração encontrada na lei."
        fi
