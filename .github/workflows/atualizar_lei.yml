name: Atualizador Automático de Lei

on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite que você force a atualização manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Baixa a versão consolidada e atualizada direto da Câmara dos Deputados
    - name: Baixar Lei Atualizada da Câmara
      run: |
        curl -sL "https://camara.leg.br" -o ctb_atualizado.html

    - name: Converter HTML para Markdown limpo
      run: |
        python -c "
        import re
        import html

        # Corrigido para utf-8 para ler corretamente a acentuação do site da Câmara
        with open('ctb_atualizado.html', 'r', encoding='utf-8', errors='ignore') as f:
            conteudo = f.read()

        # Remove scripts e estilos CSS para não poluírem o texto
        conteudo = re.sub(r'<script[^>]*>([\s\S]*?)</script>', '', conteudo)
        conteudo = re.sub(r'<style[^>]*>([\s\S]*?)</style>', '', conteudo)

        # Remove todas as tags HTML
        texto_limpo = re.sub(r'<[^>]+>', '', conteudo)
        
        # Corrige acentuações e caracteres especiais
        texto_limpo = html.unescape(texto_limpo)
        
        # Limpa linhas e espaços excessivos
        texto_limpo = re.sub(r'[ \t]+', ' ', texto_limpo)
        texto_limpo = re.sub(r'\n\s*\n', '\n\n', texto_limpo)

        # Salva o arquivo final em formato Markdown limpo em UTF-8
        with open('ctb_atualizado.md', 'w', encoding='utf-8') as f:
            f.write('# Código de Trânsito Brasileiro (Lei 9.503)\n\n' + texto_limpo.strip())
        "

    - name: Verificar mudanças e commitar
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add ctb_atualizado.html ctb_atualizado.md
        
        if ! git diff --cached --quiet; then
          git commit -m "Auto: Código de Trânsito Brasileiro atualizado em $(date +'%d/%m/%Y')"
          git push
        else
          echo "Nenhuma alteração encontrada na base da Câmara."
        fi
